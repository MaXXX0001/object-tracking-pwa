<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <title>Object tracking</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <style>
    :root { color-scheme: dark; --bg: #111418; --panel: #1b2027; --line: #2b323c; --text: #e8ecf1; --muted: #8b95a3; --accent: #ff7a1a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); max-width: 960px; margin-inline: auto; }
    h1 { font-size: 18px; margin: 4px 0 12px; }
    .stage { position: relative; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; }
    canvas { position: relative; width: 100%; height: 100%; display: block; object-fit: contain; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .timing { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-height: 1.4em; margin-bottom: 4px; }
    .overlay { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 16px; pointer-events: none; }
    .overlay[hidden] { display: none; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
    .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; align-items: center; }
    button, select, label.file { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font: inherit; min-height: 44px; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
    label.file input { display: none; }
    .control { display: flex; flex-direction: column; gap: 4px; flex: 1 1 200px; }
    .control small { color: var(--muted); }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    #status { color: var(--muted); min-height: 1.4em; }
    @media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1>Object tracking: YOLO11n + ByteTrack, on this device</h1>
  <div class="stage">
    <video id="source" playsinline muted></video>
    <canvas id="view"></canvas>
    <div class="overlay" id="hint">Start the camera or load a video. Everything runs locally in the browser.</div>
  </div>

  <div class="stats">
    <div class="stat"><b id="fps">-</b><span>FPS</span></div>
    <div class="stat"><b id="latency">-</b><span>inference, ms</span></div>
    <div class="stat"><b id="people">-</b><span>people now</span></div>
    <div class="stat"><b id="unique">-</b><span>unique IDs</span></div>
  </div>
  <div class="timing" id="timing"></div>

  <div class="row">
    <button class="primary" id="camera">Camera</button>
    <button id="flip">Flip camera</button>
    <button id="demo">Demo clip</button>
    <label class="file">Video file<input type="file" id="file" accept="video/*"></label>
    <button id="stop">Stop</button>
  </div>

  <div class="row">
    <div class="control">
      <small>Threshold: <span id="thresholdValue">0.50</span></small>
      <input type="range" id="threshold" min="0.1" max="0.9" step="0.05" value="0.5">
    </div>
    <div class="control">
      <small>Input size</small>
      <select id="size">
        <option value="320">320 (fastest)</option>
        <option value="416">416</option>
        <option value="480" selected>480</option>
        <option value="640">640 (most accurate)</option>
      </select>
    </div>
    <div class="control">
      <small>Backend</small>
      <select id="backend"></select>
    </div>
    <label><input type="checkbox" id="trails" checked> Trajectories</label>
  </div>
  <div id="status"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
